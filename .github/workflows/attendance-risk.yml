name: Automatic demo attendance checks
on:
  schedule:
    - cron: '15 * * * *'
permissions:
  contents: read
concurrency:
  group: attendance-risk-demo
  cancel-in-progress: false
jobs:
  check:
    if: vars.ATTENDANCE_DEMO_SCHEDULE_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Process due attendance batches
        env:
          ATTENDANCE_BACKEND_ORIGIN: ${{ vars.ATTENDANCE_BACKEND_ORIGIN }}
          ATTENDANCE_SCHEDULE_SECRET: ${{ secrets.ATTENDANCE_SCHEDULE_SECRET }}
        run: node .github/scripts/attendance-risk-run.cjs
