name: Automatic demo attendance checks
on:
  schedule:
    - cron: '15 * * * *'
permissions:
  contents: read
concurrency:
  group: attendance-risk-demo
  cancel-in-progress: false
jobs:
  check:
    if: vars.ATTENDANCE_DEMO_SCHEDULE_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Load scheduled client from this revision
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --hostname github.com --method GET \
            --header "Accept: application/vnd.github.raw+json" \
            "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/attendance-risk-run.cjs?ref=${GITHUB_SHA}" \
            > "${RUNNER_TEMP}/attendance-risk-run.cjs"
      - name: Process due attendance batches
        env:
          ATTENDANCE_BACKEND_ORIGIN: ${{ vars.ATTENDANCE_BACKEND_ORIGIN }}
          ATTENDANCE_SCHEDULE_SECRET: ${{ secrets.ATTENDANCE_SCHEDULE_SECRET }}
        run: node "${RUNNER_TEMP}/attendance-risk-run.cjs"
